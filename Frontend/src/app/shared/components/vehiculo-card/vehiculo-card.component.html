<div class="bg-[#d9d9d9] rounded-lg shadow-md m-10 py-4 hover:scale-105 transition-all duration-300 ease-in-out flex justify-center items-center gap-4 w-full">
    <div class="flex flex-col justify-center items-center gap-2 p-5">
        <img [src]="image?.itemImageSrc" alt="">
        <div class="flex justify-center items-center gap-10">
            <span class="flex justify-center items-center gap-2">
                <img src="../../../../assets/icons/passanger.png" alt="" width="20px" height="20px">
                <p>{{vehicle?.capacity}}</p>
            </span>
            <span class="flex justify-center items-center gap-2">
                <img src="../../../../assets/icons/bag.png" alt="" width="20px" height="20px">
                <p>{{vehicle?.detailsVehicle?.loadCapacity}}</p>
            </span>
            <span class="flex justify-center items-center gap-2">
                <img src="../../../../assets/icons/car-door.png" alt="" width="20px" height="20px">
                <p>{{vehicle?.doors}}</p>
            </span>
            <span class="flex justify-center items-center gap-2">
                <img src="../../../../assets/icons/plate.png" alt="" width="20px" height="20px">
                <p>{{lastDigitPlate}}</p>
            </span>
        </div>
    </div>
    <div class="flex flex-col justify-center items-start gap-2 grow">
        <span class="flex justify-center items-center gap-2">
            <h1 class="text-3xl jura">{{vehicle?.detailsVehicle?.brand}}&nbsp;{{vehicle?.detailsVehicle?.model}}</h1>
            <h3 class="text-2xl font-bold montserrat">$ {{price}} /{{vehicle?.typeSaleVehicle?.name}}</h3>
        </span>
        <h4 class="text-xl montserrat">{{vehicle?.availability}}</h4>
        <p class="text-lg montserrat">{{vehicle?.description}}</p>
        <app-button [label]="labelButton" type="link" redirecTo="/vehicles/detail/{{vehicle?.uuid}}"></app-button>
    </div>
</div>
