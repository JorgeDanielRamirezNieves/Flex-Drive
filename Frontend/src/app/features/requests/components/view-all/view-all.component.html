<app-navbar></app-navbar>
<section class="flex bg-white">
  <app-menu-column></app-menu-column>
  <div class="flex flex-col justify-center items-center px-20 grow space-y-10 my-20">
    <h2 class="text-4xl font-bold mb-4 jura">Todas las solicitudes</h2>
    <p-accordion [value]="[]" multiple="true" class="w-full">
      @for (request of requests; track $index) {
      <p-accordionpanel [value]="$index" class="w-full">
        <p-accordionheader class="w-full">
          <ng-template #toggleicon let-active="active">
            @if (active) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-eye-icon lucide-eye"
            >
              <path
                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
            } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-eye-closed-icon lucide-eye-closed"
            >
              <path d="m15 18-.722-3.25" />
              <path d="M2 8a10.645 10.645 0 0 0 20 0" />
              <path d="m20 15-1.726-2.05" />
              <path d="m4 15 1.726-2.05" />
              <path d="m9 18 .722-3.25" />
            </svg>
            }
          </ng-template>
          <h3 class="text-xl font-bold">Solicitud de {{ request.driver }}</h3>
        </p-accordionheader>
        <p-accordioncontent>
          <app-details [request]="request" class="w-full"></app-details>
        </p-accordioncontent>
      </p-accordionpanel>
      }
    </p-accordion>
  </div>
</section>
<app-footer></app-footer>
