<app-navbar></app-navbar>

<div class="bg-white flex">
  <app-menu-column></app-menu-column>
  <div class="w-full p-20">
    <app-card-settings
      class="mx-5"
      *ngFor="let card of cards"
      [card]="card"
    ></app-card-settings>
    <div class="flex justify-around items-center gap-8 bg-[#d9d9d9] rounded-lg shadow-md p-8 py-10 mb-20 hover:scale-105 transition-all duration-300 ease-in-out">
      <img src="../../../../../assets/icons/preferencia.png" class="w-[10%] mx-auto" alt="">
      <span class="flex flex-col items-start">
        <h3 class="text-2xl jura font-bold">Preferencias de vehículos</h3>
        <p class="monserrat">Aquí podrás cambiar las preferencias de vehículos que se te muestran en la aplicacion.</p>
      </span> 
      <app-button label="Cambiar preferencias" type="link" [redirecTo]="'/user/preferences/'"></app-button>
    </div>
  </div>
</div>

<app-footer></app-footer>
