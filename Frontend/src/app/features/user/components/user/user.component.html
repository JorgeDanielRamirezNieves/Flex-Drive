<app-navbar></app-navbar>

<div class="bg-white flex">
  <app-menu-column></app-menu-column>

  <div class="flex flex-col w-full">
    <div
      class="flex justify-center items-center w-[80%] h-80 bg-[#d9d9d9] mx-auto mt-20 rounded-3xl"
    >
      <div class="w-[35%]">
        <div
          class="m-auto w-40 h-40 flex justify-center items-center"
        >
          <img
            [src]="user?.image"
            alt=""
          />
        </div>
      </div>
      <div class="w-[65%]">
        <div class="">
          <h2 class="text-2xl jura font-bold">{{user?.firstName}} {{user?.lastName}}</h2>
          <h2 class="montserrat font-bold">{{user?.email}}</h2>
          <h3 class="montserrat">{{user?.phone}}</h3>
          <h3 class="montserrat">{{user?.city}}, {{user?.country}}</h3>
        </div>
      </div>
    </div>
    <div class="pl-20 mt-20 text-2xl">
      <h2 class="montserrat font-bold">Vehiculos</h2>
    </div>
    <div class="grid grid-cols-2 gap-20 w-full h-fit p-20">
      @if (vehicles && vehicles.length > 0) {
        <app-card-pequenna *ngFor="let vehicle of vehicles" [Vehicle]="vehicle"></app-card-pequenna>
      } @else {
        <div class="flex justify-center items-center w-full h-80 bg-[#d9d9d9] mx-auto mt-20 rounded-3xl col-span-2">
          <h2 class="text-2xl jura font-bold">No tienes vehiculos registrados</h2>
        </div>
      }
    </div>
  </div>
</div>

<app-footer></app-footer>
