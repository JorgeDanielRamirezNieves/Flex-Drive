<div
  class="flex flex-col justify-center items-center gap-8 bg-[#d9d9d9] rounded-lg shadow-md py-4 hover:scale-105 transition-all duration-300 ease-in-out"
>
  <img [src]="card.image" alt="carro.png" class="w-1/2 h-1/2 mx-auto" />
  <h2 class="text-2xl jura font-extrabold">{{ card.title }}</h2>
  <div class="px-5 text-center">
    <h3 class="montserrat">{{ card.description }}</h3>
  </div>
  <h3 class="text-xl montserrat font-bold">{{ card.price }}</h3>
  <app-button
    [label]="card.buttonLabel"
    icon="pi pi-arrow-right"
    iconPos="right"
  ></app-button>
</div>
