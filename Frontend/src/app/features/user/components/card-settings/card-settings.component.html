<div
  class="flex justify-around items-center gap-8 bg-[#d9d9d9] rounded-lg shadow-md p-8 py-10 mb-20 hover:scale-105 transition-all duration-300 ease-in-out"
>
  <div class="flex justify-center items-center mx-auto">
    <img [src]="card.imageS" alt="carro.png" class="w-1/5" />
  </div>
  <div class="w-[70%]">
    <h2 class="text-2xl jura font-extrabold">{{ card.title }}</h2>
    <h3 class="montserrat">{{ card.description }}</h3>
  </div>
  <div class="flex justify-center items-center w-[20%]">
    <app-toggle-button
      [toggleType]="card.toggle.type"
      [icons]="card.toggle.icons"
      [labels]="card.toggle.labels"
      [(value)]="card.toggle.value"
    ></app-toggle-button>
  </div>
</div>
