<div class="flex w-full h-full">
  <div class="flex flex-col w-64 bg-[#031617] text-white">
    <div
      *ngFor="let item of menuItems"
      (click)="setSection(item.section)"
      class="flex flex-col pl-5 no-underline jura py-5 cursor-pointer transition-all duration-500"
      [ngClass]="{
        'bg-[#54A8A3] text-white': activeSection === item.section,
        'hover:bg-[#54A8A3] text-white': activeSection !== item.section
      }"
    >
      <span class="transition-all duration-300 whitespace-nowrap">
        {{ item.title }}
      </span>

      <div *ngIf="item.users && activeSection === item.section" class="mt-2">
        <span
          *ngFor="let u of item.users"
          (click)="selectUser(u); $event.stopPropagation()"
          class="hover:bg-[#031617] hover:text-white montserrat font-extralight text-[13px] block border-t border-white px-4 py-1 transition-all duration-500"
        >
          {{ u.names }} {{ u.lastName }}
        </span>
      </div>
    </div>
  </div>

  <div class="flex-grow p-6 bg-gray-100 overflow-y-auto">
    <div *ngIf="selectedUser">
      <div class="flex items-center gap-4 mb-4">
        <button
          (click)="selectedUser = null"
          class="text-[#031617] border-2 border-transparent hover:border-black hover:cursor-pointer rounded-full p-2 font-semibold transitions-all duration-200"
        >
          ← Volver
        </button>
        <h2 class="text-xl font-bold">
          Conversación con {{ selectedUser.names }} {{ selectedUser.lastName }}
        </h2>
      </div>

      <div class="flex flex-col gap-2 overflow-y-auto flex-grow mb-4 h-[70vh]">
        <div
          *ngFor="let msg of selectedUser.messages"
          [ngClass]="{
            'justify-end': msg.sender === 'yo',
            'justify-start': msg.sender !== 'yo'
          }"
          class="flex"
        >
          <div
            [ngClass]="
              msg.sender === 'yo'
                ? 'bg-[#54A8A3] text-white'
                : 'bg-gray-200 text-black'
            "
            class="p-3 rounded-lg max-w-[70%]"
          >
            <p class="text-sm">{{ msg.text }}</p>
          </div>
        </div>
      </div>

      <div class="sticky bottom-1 w-full flex items-center gap-2 p-2">
        <input
          type="text"
          [(ngModel)]="newMessage"
          placeholder="Escribe un mensaje..."
          class="flex-grow border border-gray-300 rounded-full px-4 py-2 focus:outline-none bg-white"
        />
        <label
          for="file-upload"
          class="text-gray-500 hover:bg-[#54A8A3] cursor-pointer"
        >
          <i class="pi pi-paperclip text-xl"></i>
          <input
            id="file-upload"
            type="file"
            accept="image/*"
            class="hidden"
            (change)="onFileSelected($event)"
          />
        </label>
        <button
          (click)="sendMessage()"
          class="text-white bg-[#54A8A3] hover:bg-[#031617] w-15 h-15 rounded-full p-2"
        >
          <i class="pi pi-send text-lg"></i>
        </button>
      </div>
    </div>

    <div *ngIf="!selectedUser">
      <h2 class="text-xl font-bold mb-4">
        <ng-container [ngSwitch]="activeSection">
          <ng-container *ngSwitchCase="'recientes'"
            >Servicios en recientes</ng-container
          >
          <ng-container *ngSwitchCase="'en-proceso'"
            >Servicios en proceso</ng-container
          >
          <ng-container *ngSwitchCase="'todos'"
            >Todos los servicios</ng-container
          >
        </ng-container>
      </h2>

      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Buscar por nombre..."
        class="mb-4 p-4 bg-[#D9D9D9] rounded-4xl w-full"
      />

      <div *ngFor="let user of getFilteredUsers()">
        <div
          class="cursor-pointer p-5 border-b-1 hover:bg-[#54A8A3] hover:rounded-4xl transition-all duration-500"
          (click)="selectedUser = user"
        >
          {{ user.names }} {{ user.lastName }}
        </div>
      </div>
    </div>
  </div>
</div>
