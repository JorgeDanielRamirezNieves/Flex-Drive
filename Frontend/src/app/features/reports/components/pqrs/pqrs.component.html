<app-navbar></app-navbar>

<div class="bg-white flex">
  <app-menu-column></app-menu-column>
  <div class="flex justify-center w-full flex-col items-center">
    <div class="flex justify-center">
      <h2 class="text-2xl jura font-bold m-8">PQRS</h2>
    </div>
    <div
      class="justify-center flex-col w-[70rem] rounded-3xl p-15 bg-[#d9d9d9] mb-20"
    >
      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
        <app-input-label
          label="Tipo de PQRS"
          placeholder="Seleccione un tipo de PQRS"
          name="tipoDePeticion"
          [model]="formData"
          modelProperty="typePQRS"
          [isSelect]="true"
          [options]="[
            {
              value: 'd26a7cac-554c-4828-a8ee-a3fb71ead312',
              label: 'Petición'
            },
            { value: 'ccc363e3-5510-43ec-9651-ba8315f87d5a', label: 'Queja' },
            { value: '5a10182f-7056-4285-a01e-956610e9021e', label: 'Reclamo' },
            {
              value: '4f7c93dc-8320-4d1f-8931-96dc8e7c3f06',
              label: 'Solicitud'
            },
            {
              value: 'd07dcae8-4e4b-4620-8478-9bea31db8fe6',
              label: 'Contacto'
            }
          ]"
          [submitted]="submitted"
        ></app-input-label>

        <app-input-label
          label="Código de servicio"
          placeholder="1232412"
          type="text"
          name="idService"
          [model]="formData"
          modelProperty="idService"
        ></app-input-label>

        <span class="jura"> Mensaje de reporte </span>

        <textarea
          name="mensaje"
          id=""
          rows="5"
          class="bg-white w-full mt-5 p-2 rounded-lg resize-none placeholder:text-gray-500"
          placeholder="Enviale un mensaje con tu PQRS..."
          modelProperty="description"
          name="description"
          [(ngModel)]="formData.description"
        ></textarea>

        <div class="mt-6 flex flex-col items-center space-y-4">
          <button
            type="submit"
            class="w-[20rem] bg-[#54A8A3] text-white py-2 px-4 rounded border-2 border-transparent hover:bg-transparent hover:cursor-pointer hover:border-[#54A8A3] hover:text-[#54A8A3] focus:outline-none focus:ring-2 focus:ring-[#ADF9F6] focus:ring-offset-2 transition duration-300 ease-in-out"
          >
            Enviar Mensaje
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
