<app-navbar></app-navbar>
<section class="flex bg-white">
  <app-menu-column></app-menu-column>
  <div class="w-full flex flex-col justify-center text-center my-15">
    <div class="">
      <h2 class="text-2xl font-bold jura mx-auto">PQRS por Categoría</h2>
    </div>
    <div
      class="flex w-full flex-col justify-center items-center px-20 space-y-10 my-20"
    >
      <div>
        <div class="w-full">
          <div
            *ngFor="
              let tipo of ['claims', 'complaint', 'petition', 'suggestion']
            "
            class="bg-[#D9D9D9] p-4 rounded shadow mb-15 w-dvh hover:cursor-pointer duration-300 ease-in-out hover:shadow-sm hover:scale-[1.02]"
            (click)="toggleTipo(tipo)"
          >
            <h3
              class="text-xl font-semibold my-10 capitalize hover:cursor-pointer"
            >
              {{ tiposMap[tipo] }}
            </h3>
            <div *ngIf="tipoExpandido === tipo">
              <div
                *ngFor="let pqrs of getPQRSByTipo(tipo)"
                class="bg-white rounded p-8 mb-4 shadow space-y-10"
              >
                <p class="montserrat">
                  <strong class="jura">Nombre:</strong>
                  {{ pqrs.typeReport.name }}
                </p>
                <p class="montserrat">
                  <strong class="jura">Servicio:</strong>
                  {{ pqrs.idTypeReport }}
                </p>
                <p class="montserrat">
                  <strong class="jura">Mensaje:</strong> {{ pqrs.description }}
                  <strong class="jura">IDDDDD:</strong> {{ pqrs.uuid }}
                </p>

                <button
                  class="w-[20rem] bg-[#54A8A3] text-white py-2 px-4 rounded border-2 border-transparent hover:bg-transparent hover:cursor-pointer hover:border-[#54A8A3] hover:text-[#54A8A3] focus:outline-none focus:ring-2 focus:ring-[#ADF9F6] focus:ring-offset-2 transition duration-300 ease-in-out"
                  (click)="toggleRespuesta(pqrs.uuid)"
                >
                  Responder
                </button>
                <div *ngIf="visibleResponseBox[pqrs.uuid]" class="mt-3">
                  <textarea
                    rows="3"
                    class="w-full p-2 border rounded-lg resize-none placeholder:text-gray-500"
                    placeholder="Escribe tu respuesta..."
                  ></textarea>
                  <button
                    class="w-[20rem] bg-[#54A8A3] text-white py-2 px-4 rounded border-2 border-transparent hover:bg-transparent hover:cursor-pointer hover:border-[#54A8A3] hover:text-[#54A8A3] focus:outline-none focus:ring-2 focus:ring-[#ADF9F6] focus:ring-offset-2 transition duration-300 ease-in-out"
                    (click)="enviarRespuesta(pqrs)"
                  >
                    Enviar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
