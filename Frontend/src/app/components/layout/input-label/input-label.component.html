<div class="mb-4">
  <h2 class="jura font-bold mb-2">{{ label }}</h2>

  <div class="relative">
    <input
      [type]="inputType"
      class="montserrat w-full pr-10 py-2 px-3 border border-gray-300 rounded"
      [placeholder]="placeholder"
      [name]="name"
      ngModel
      required
    />

    <!-- Ícono para mostrar/ocultar contraseña -->
    <i
      *ngIf="type === 'password'"
      class="pi"
      [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"
      (click)="togglePasswordVisibility()"
      style="
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
      "
    ></i>
  </div>
</div>
