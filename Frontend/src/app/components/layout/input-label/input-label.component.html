<div class="mb-4">
  <h2 class="jura font-bold mb-2">{{ label }}</h2>

  <div class="relative">
    <input
      #input="ngModel"
      [type]="showPassword ? 'text' : inputType"
      class="montserrat w-full pr-10 py-2 px-3 border border-gray-300 rounded outline-2 outline-transparent focus-within:outline-[#54A8A3]  transition duration-300 ease-in-out"
      [placeholder]="placeholder"
      [name]="name"
      [(ngModel)]="model[modelProperty]"
      required
    />

    <i
      *ngIf="type === 'password'"
      class="pi"
      [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"
      (click)="togglePasswordVisibility()"
      style="
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
      "
    ></i>
  </div>
  <div
    class="text-red-500 text-sm mt-1"
    *ngIf="(submitted || input?.touched) && input?.invalid"
  >
    Este campo es obligatorio
  </div>
</div>
