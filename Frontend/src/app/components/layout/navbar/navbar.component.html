<nav
  class="flex justify-around items-center bg-[#031617] text-white italic montserrat h-30 shadow-[0_10px_60px_23px_#031617] w-full"
>
  <img
    src="../../../../assets/imagotipo.png"
    alt="logo.png"
    class="h-20 mx-20 cursor-pointer"
    [routerLink]="['']"
    routerLinkActive="router-link-active"
  />
  <span class="flex justify-center items-center h-full grow mx-5">
    <a
      [routerLink]="['/landing/whyUs']"
      routerLinkActive="router-link-active"
      class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      >¿Por qué Flex Drive?</a
    >
    <a
      [routerLink]="['/landing/aboutUs']"
      routerLinkActive="router-link-active"
      class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      >Acerca de nosotros</a
    >
    <a
      [routerLink]="['/landing/contactUs']"
      routerLinkActive="router-link-active"
      class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      >Contacto</a
    >

    <a
      class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      [routerLink]="['/user/login']"
      routerLinkActive="router-link-active"
      >Iniciar Sesión</a
    >
    <a
      class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      [routerLink]="['/admin/admin-pqrs']"
      routerLinkActive="router-link-active"
      >ad</a
    >
    <!-- Quitar esto despues -->
    <ng-container *ngIf="!isLoggedIn; else loggedInOptions">
      <a
        class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
        (click)="toggleLogin()"
        >Simular login</a
      >
    </ng-container>

    <ng-template #loggedInOptions>
      <button
        class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      >
        <a
          [routerLink]="['/user']"
          class="w-full h-full flex flex-col justify-center items-center"
        >
          <span><i class="pi pi-user text-2xl"></i></span>
        </a>
      </button>

      <button
        (click)="toggleLogin()"
        class="w-full h-full flex flex-col justify-center items-center cursor-pointer transition-all duration-200 hover:text-[#54A8A3] hover:bg-[#031920]"
      >
        Cerrar sesión
      </button>
    </ng-template>

    <!--  -->
  </span>
</nav>
