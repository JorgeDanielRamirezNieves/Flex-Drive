<footer
  class="bg-[#031617] text-white montserrat flex flex-col justify-center items-center h-full w-full py-5 pt-10"
>
  <div class="flex justify-around gap-5 items-center h-full w-full">
    <img
      src="../../../../assets/imagotipo.png"
      alt="logo.png"
      class="h-30 cursor-pointer"
      [routerLink]="['']"
      routerLinkActive="router-link-active"
    />
    <span class="text-xs">
      <a
        *ngFor="let item of footerContactInfo"
        class="my-2 flex items-center gap-3 cursor-pointer hover:text-[#54A8A3] transition-all duration-200"
      >
        <img [src]="item.icon" alt="icon" class="w-4 h-4" />
        {{ item.text }}
      </a>
    </span>
    <span class="text-gray-400 text-xs">
      <a
        *ngFor="let item of footerLinks"
        [routerLink]="item.link"
        class="my-2 flex items-center gap-3 cursor-pointer hover:text-[#54A8A3] transition-all duration-200"
      >
        {{ item.text }}
      </a>
    </span>
  </div>
  <div
    class="flex justify-between gap-5 items-center w-[82%] h-full text-gray-400 mt-10"
  >
    <span class="flex justify-center items-center text-xs h-full gap-5 ml-7">
      <p>English</p>
      <p>Privacy</p>
      <p>Legal</p>
    </span>
    <p class="text-xs mr-8">© 2025 All Rights Reserved.</p>
  </div>
</footer>
