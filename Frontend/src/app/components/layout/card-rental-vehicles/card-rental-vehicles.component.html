<div
  id="card-rental-vehicles"
  [routerLink]="['/services/details']"
  routerLinkActive="router-link-active"
  class="flex items-center gap-4 bg-[#d9d9d9] rounded-lg shadow-md mx-15 py-4 hover:cursor-pointer hover:scale-105 transition-all duration-300 ease-in-out"
>
  <div class="w-80 p-4">
    <img
      src="../../../../assets/carro.png"
      alt="carro.png"
      class="w-auto mx-auto"
    />
  </div>
  <div class="w-full mx-10 space-y-4">
    <div class="flex justify-between jura w-full">
      <p>5 Marzo 2025</p>
      <p>En viaje</p>
    </div>
    <div class="border-[0.5px] border-[#000]"></div>
    <div>
      <div class="justify-between jura w-full flex">
        <h2 class="text-2xl jura font-bold">Suzuki Swift</h2>
        <p class="font-bold">Arrendatario</p>
      </div>
      <div class="justify-between jura w-full flex my-5">
        <div class="flex justify-between items-center gap-10">
          <span class="flex justify-center items-center gap-2">
            <img
              src="../../../../assets/icons/passanger.png"
              alt="passanger.png"
              class="w-1/4"
            />
            <p>#</p>
          </span>
          <span class="flex justify-center items-center gap-2">
            <img
              src="../../../../assets/icons/bag.png"
              alt="passanger.png"
              class="w-1/3"
            />
            <p>#</p>
          </span>
          <span class="flex justify-center items-center gap-2">
            <img
              src="../../../../assets/icons/car-door.png"
              alt="passanger.png"
              class="w-1/3"
            />
            <p>#</p>
          </span>
          <span class="flex justify-center items-center gap-2">
            <img
              src="../../../../assets/icons/plate.png"
              alt="passanger.png"
              class="w-1/2"
            />
            <p>#</p>
          </span>
        </div>
        <div>
          <p>Compacto, eficiente y económico</p>
        </div>
      </div>
      <div class="flex justify-between jura w-full items-center">
        <h3 class="text-xl montserrat font-bold">$ 120.000 /dia</h3>
        <svg
          id="eye-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-eye-icon lucide-eye"
        >
          <path
            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </div>
    </div>
  </div>
</div>
