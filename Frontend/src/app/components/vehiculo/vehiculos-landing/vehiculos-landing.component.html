<app-navbar></app-navbar>
<main class="flex flex-col justify-center items-center">
  <section
    class="flex flex-col items-center justify-center p-5 h-[80dvh] w-full image-background jura z-20"
  >
    <span class="w-full flex flex-col items-center justify-center">
      <h1 class="text-6xl text-white w-full text-center mb-10">
        Busca Tu vehículo
      </h1>
      <form
        class="flex items-center justify-center gap-2 w-5/6 h-fit p-5"
        #frmBusqueda="ngForm"
        (submit)="frmBusqueda.form.valid && search(frmBusqueda)"
      >
        <input
          type="text"
          pInputText
          placeholder="nombre, marca..."
          [(ngModel)]="busqueda"
          required="true"
          class="w-full h-10 p-2 rounded-md text-black grow"
          name="busqueda"
        />
        <app-button label="" icon="pi pi-search" type="submit"></app-button>
      </form>
    </span>

    <p-select [options]="tiposBusqueda" [(ngModel)]="tipoBusquedaSeleccionado">
    </p-select>
  </section>

          [circular]="true"

  </div>
</main>
<app-footer class="z-20"></app-footer>
